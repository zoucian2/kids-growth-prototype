<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兒童成長 Prototype v0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f7f7f4;color:#252525}button{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.stars{font-size:24px}.screen{display:none}.screen.active{display:block}.center{text-align:center}.roles,.tasks,.growth{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}.role,.task,.card{border:0;background:white;border-radius:28px;padding:30px;box-shadow:0 5px 20px #0000000c;min-height:180px;cursor:pointer}.role .emoji,.task .emoji{font-size:64px}.role b,.task b{display:block;font-size:26px;margin-top:12px}.task small{font-size:20px}.lock{position:fixed;right:28px;bottom:28px;border:0;background:none;font-size:18px}.hero{font-size:92px;margin:35px 0 10px}.title{font-size:38px;font-weight:800}.sub{font-size:24px;color:#666}.primary{border:0;border-radius:22px;background:#222;color:#fff;padding:20px 42px;font-size:28px;font-weight:700;cursor:pointer}.steps{display:inline-block;text-align:left;font-size:24px;line-height:1.8;margin:20px}.reward{font-size:32px;margin:24px}.big{font-size:58px}.learn{max-width:700px;margin:35px auto;background:white;border-radius:30px;padding:40px;font-size:30px;line-height:1.5}.nav{display:flex;justify-content:center;gap:18px;margin-top:40px;flex-wrap:wrap}.nav button{border:0;background:white;border-radius:18px;padding:14px 20px;font-size:20px}.growth{grid-template-columns:1fr 1fr}.growth .card{font-size:24px;min-height:130px}.back{border:0;background:none;font-size:24px;cursor:pointer}@media(max-width:760px){.roles,.tasks{grid-template-columns:1fr 1fr}.growth{grid-template-columns:1fr}.app{padding:18px}.title{font-size:32px}}
</style></head>
<body><main class="app">
<section id="role" class="screen active center"><div class="title">🌱 今天是誰？</div><div class="roles"><button class="role" onclick="home('哥哥','👦')"><span class="emoji">👦</span><b>哥哥</b></button><button class="role" onclick="home('妹妹','👧')"><span class="emoji">👧</span><b>妹妹</b></button><button class="role" onclick="home('弟弟','👶')"><span class="emoji">👶</span><b>弟弟</b></button></div><button class="lock" onclick="alert('家長模式會在下一版加入 🔒')">🔒 家長</button></section>
<section id="home" class="screen"><div class="top"><div><span id="who" class="title"></span><div class="sub">☀️ 今天有這些事情</div></div><div class="stars">⭐ <span id="starCount">580</span></div></div><div class="tasks"><button class="task" onclick="alert('這次測試先試「整理書包」喔')"><span class="emoji">🪥</span><b>刷牙</b><small>⭐5</small></button><button class="task" onclick="show('task')"><span class="emoji">🎒</span><b>整理書包</b><small>⭐10</small></button><button class="task" onclick="alert('這次測試先試「整理書包」喔')"><span class="emoji">📖</span><b>閱讀</b><small>⭐10</small></button></div><div class="nav"><button>🏠 今天</button><button onclick="show('growth')">📖 成長</button><button onclick="alert('心情功能下一版測試')">😊 心情</button><button onclick="alert('獎勵功能下一版測試')">🎁 獎勵</button><button onclick="alert('我的世界下一版測試')">🌱 世界</button></div></section>
<section id="task" class="screen center"><button class="back" onclick="show('home')">← 回去</button><div class="hero">🎒</div><div class="title">整理我的書包</div><div class="steps">📚 課本<br>✏️ 鉛筆盒<br>🥤 水壺</div><div class="reward">完成得到 ⭐10</div><button class="primary" onclick="completeTask()">✓ 我完成了！</button></section>
<section id="done" class="screen center"><div style="padding-top:12vh"><div class="big">✨ ⭐ ✨</div><div class="title" style="margin-top:24px">做到了！</div><div class="reward">⭐ +10　🌱 +10</div><div class="big">🌿</div></div></section>
<section id="learn" class="screen center"><div class="big">✨</div><div class="title">我學會了！</div><div class="learn">🎒<br><br>自己的事情，我可以自己準備。<br><br><b>🌱 獨立自主</b></div><button class="primary" onclick="show('growth')">知道了！</button></section>
<section id="growth" class="screen"><div class="top"><button class="back" onclick="show('home')">← 今天</button><div class="title">📖 我的成長</div><div></div></div><p class="sub center">看看我已經學會多少事情 🌱</p><div class="growth"><div class="card"><b>🌱 我現在會自己做了</b><br><br>🎒 自己整理書包<br>👕 自己準備衣服</div><div class="card"><b>💪 原來我做得到</b><br><br>💃 第一次完成表演</div><div class="card"><b>❤️ 我正在成為這樣的人</b><br><br>🫶 我會注意別人的感受</div><div class="card"><b>😊 我越來越懂自己</b><br><br>🌬️ 生氣時先讓自己安靜</div></div></section>
</main><script>
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function home(n,e){document.getElementById('who').textContent=e+' '+n;show('home')}
function completeTask(){document.getElementById('starCount').textContent='590';show('done');setTimeout(()=>show('learn'),1800)}
</script></body></html>
